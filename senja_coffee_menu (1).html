<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senja Coffee - Digital Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* === DESIGN TOKENS & VARIABLES === */
        :root {
            --bg-color: #fdf8f5;
            --text-main: #3e2723;
            --text-muted: #795548;
            --primary: #8b5a2b;
            --primary-hover: #6b4423;
            --accent: #d4a373;
            --white: #ffffff;
            --card-shadow: 0 10px 20px rgba(139, 90, 43, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding-bottom: 100px; /* Space for the floating cart */
            -webkit-font-smoothing: antialiased;
        }

        /* === TYPOGRAPHY === */
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }

        /* === HEADER === */
        header {
            background: linear-gradient(rgba(62, 39, 35, 0.8), rgba(62, 39, 35, 0.9)), url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=1200&q=80') center/cover;
            color: var(--white);
            padding: 60px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* === CATEGORY FILTERS === */
        .filters {
            display: flex;
            gap: 12px;
            padding: 25px 20px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE and Edge */
        }
        
        .filters::-webkit-scrollbar {
            display: none; /* Chrome, Safari and Opera */
        }

        .filter-btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: var(--white);
        }

        /* === MENU GRID === */
        .menu-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 0 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        @media (min-width: 600px) {
            .menu-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 900px) {
            .menu-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .menu-card {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(139, 90, 43, 0.15);
        }

        .menu-img-container {
            position: relative;
            padding-top: 65%; /* Aspect ratio for images */
            overflow: hidden;
        }

        .menu-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .menu-card:hover img {
            transform: scale(1.05);
        }

        .menu-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .menu-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .menu-card h3 {
            font-size: 1.2rem;
            color: var(--text-main);
            line-height: 1.3;
        }

        .menu-price {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
            white-space: nowrap;
            margin-left: 10px;
        }

        .menu-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .add-btn {
            background: var(--bg-color);
            color: var(--primary);
            border: 1px solid var(--accent);
            padding: 10px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .add-btn:active {
            transform: scale(0.97);
        }

        /* === FLOATING CART === */
        .cart-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            pointer-events: none; /* Let clicks pass through empty areas */
            z-index: 100;
            display: flex;
            justify-content: center;
        }

        .cart-container {
            background: var(--white);
            border-radius: 20px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 600px;
            pointer-events: auto; /* Re-enable clicks for the cart itself */
            transform: translateY(150%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(139, 90, 43, 0.1);
        }

        .cart-container.visible {
            transform: translateY(0);
        }

        .cart-info {
            display: flex;
            flex-direction: column;
        }

        .cart-items-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .cart-total {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }

        .checkout-btn {
            background: #25D366; /* WhatsApp Green */
            color: var(--white);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: var(--transition);
        }

        .checkout-btn:hover {
            background: #128C7E;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        /* === CUSTOM TOAST NOTIFICATION === */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--primary);
            color: var(--white);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <span id="toast-msg">Added to cart</span>
    </div>

    <header>
        <h1>Senja Coffee</h1>
        <p>Aesthetic bites & brews for your golden hour.</p>
    </header>

    <div class="filters" id="filter-container">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="kopi">Kopi</button>
        <button class="filter-btn" data-filter="non-kopi">Non-Kopi</button>
        <button class="filter-btn" data-filter="camilan">Camilan</button>
    </div>

    <main class="menu-container" id="menu-grid">
        <!-- Menu cards will be injected here via JavaScript -->
    </main>

    <div class="cart-wrapper">
        <div id="cart" class="cart-container">
            <div class="cart-info">
                <span class="cart-items-count" id="cart-count">0 items</span>
                <span class="cart-total" id="cart-total">Rp 0</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWA()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                Checkout
            </button>
        </div>
    </div>

    <script>
        // === DATA STORE ===
        const menuData = [
            { id: 1, category: 'kopi', name: "Kopi Tubruk", desc: "Kopi hitam pekat dari biji robusta pilihan khas Nusantara.", price: 15000, img: "https://images.unsplash.com/photo-1559525839-b184a4d698c7?auto=format&fit=crop&w=600&q=80" },
            { id: 2, category: 'kopi', name: "Cappuccino", desc: "Espresso klasik dengan paduan susu steam dan foam tebal.", price: 25000, img: "https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=600&q=80" },
            { id: 3, category: 'kopi', name: "Es Kopi Susu Senja", desc: "Menu andalan! Kopi espresso, susu creamy, dan gula aren asli.", price: 20000, img: "https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=600&q=80" },
            { id: 4, category: 'non-kopi', name: "Matcha Latte", desc: "Teh hijau bubuk asli Jepang dipadu susu segar manis.", price: 28000, img: "https://images.unsplash.com/photo-1515823064-d6e0c04616a4?auto=format&fit=crop&w=600&q=80" },
            { id: 5, category: 'non-kopi', name: "Red Velvet", desc: "Minuman rasa kue red velvet yang manis dan creamy.", price: 28000, img: "https://images.unsplash.com/photo-1623861536762-b91cba0bc429?auto=format&fit=crop&w=600&q=80" },
            { id: 6, category: 'camilan', name: "Croissant", desc: "Roti ala Prancis yang renyah di luar, lembut dan gurih di dalam.", price: 22000, img: "https://images.unsplash.com/photo-1555507036-ab1f40ce88cb?auto=format&fit=crop&w=600&q=80" },
            { id: 7, category: 'camilan', name: "French Fries", desc: "Kentang goreng renyah dengan taburan garam dan saus sambal.", price: 18000, img: "https://images.unsplash.com/photo-1576107232684-1279f3908594?auto=format&fit=crop&w=600&q=80" }
        ];

        // === STATE ===
        let cart = {};

        // === DOM ELEMENTS ===
        const menuGrid = document.getElementById('menu-grid');
        const filterContainer = document.getElementById('filter-container');
        const cartElement = document.getElementById('cart');
        const cartCountEl = document.getElementById('cart-count');
        const cartTotalEl = document.getElementById('cart-total');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');

        // === RENDER MENU ===
        function renderMenu(filter = 'all') {
            menuGrid.innerHTML = '';
            
            const filteredData = filter === 'all' 
                ? menuData 
                : menuData.filter(item => item.category === filter);

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-card';
                card.innerHTML = `
                    <div class="menu-img-container">
                        <img src="${item.img}" alt="${item.name}" loading="lazy">
                    </div>
                    <div class="menu-info">
                        <div class="menu-title-row">
                            <h3>${item.name}</h3>
                            <span class="menu-price">Rp ${item.price.toLocaleString('id-ID')}</span>
                        </div>
                        <p class="menu-desc">${item.desc}</p>
                        <button class="add-btn" onclick="addToCart(${item.id})">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                            Add to Cart
                        </button>
                    </div>
                `;
                menuGrid.appendChild(card);
            });
        }

        // === FILTER LOGIC ===
        filterContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                // Update active class
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                
                // Filter items
                const filterValue = e.target.getAttribute('data-filter');
                renderMenu(filterValue);
            }
        });

        // === CART LOGIC ===
        window.addToCart = function(id) {
            const item = menuData.find(m => m.id === id);
            if (!item) return;

            if (cart[id]) {
                cart[id].qty += 1;
            } else {
                cart[id] = { ...item, qty: 1 };
            }
            
            updateCartUI();
            showToast(`${item.name} added!`);
        }

        function updateCartUI() {
            let totalQty = 0;
            let totalPrice = 0;

            for (const key in cart) {
                totalQty += cart[key].qty;
                totalPrice += cart[key].price * cart[key].qty;
            }

            if (totalQty > 0) {
                cartElement.classList.add('visible');
                cartCountEl.textContent = `${totalQty} item${totalQty > 1 ? 's' : ''} in cart`;
                cartTotalEl.textContent = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            } else {
                cartElement.classList.remove('visible');
            }
        }

        // === CHECKOUT WHATSAPP ===
        window.checkoutWA = function() {
            const objKeys = Object.keys(cart);
            if (objKeys.length === 0) return;

            let text = "Hello Senja Coffee! ☕\nI'd like to order:\n\n";
            let totalPrice = 0;

            objKeys.forEach((key, index) => {
                const item = cart[key];
                const subTotal = item.price * item.qty;
                totalPrice += subTotal;
                text += `${index + 1}. ${item.name}\n   ${item.qty}x Rp ${item.price.toLocaleString('id-ID')} = Rp ${subTotal.toLocaleString('id-ID')}\n\n`;
            });

            text += `*Total Order: Rp ${totalPrice.toLocaleString('id-ID')}*\n\n`;
            text += `Table Number: [Fill your table number here]\nThank you!`;

            // Replace with the actual coffee shop WA number (use international format without +)
            const waNumber = "6281234567890"; 
            const encodedText = encodeURIComponent(text);
            const waUrl = `https://wa.me/${waNumber}?text=${encodedText}`;

            window.open(waUrl, '_blank');
        }

        // === TOAST NOTIFICATION (Replaces alert()) ===
        let toastTimeout;
        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Initialize App
        renderMenu();

    </script>
</body>
</html>
